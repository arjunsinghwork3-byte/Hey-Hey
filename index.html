<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff7fa">
  <title>Will You Be My Girlfriend? 💗</title>
  <meta name="description" content="A tiny question for someone special.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <main class="page">
    <section class="card" id="card" aria-live="polite">
      <div id="questionView">
        <div class="sticker bear" aria-hidden="true">
          <div class="bear-ear left"></div><div class="bear-ear right"></div>
          <div class="bear-face">
            <span class="eye e1"></span><span class="eye e2"></span>
            <span class="snout"></span>
            <span class="heart-mini">♥</span>
          </div>
        </div>

        <h1>Hi <span id="recipient">Sawari</span>, will you do me the honor of seeing your beautiful smile and the cute blink that you always do?</h1>
        <p class="sub">I have an important question for you 🥺</p>

        <div class="actions" id="actions">
          <button class="yes" id="yesBtn">Yes 💗</button>
          <button class="no" id="noBtn">No</button>
        </div>

        <p class="hint" id="hint">go on… say yes 🫶</p>
      </div>

      <div id="successView" class="success hidden" aria-hidden="true">
        <h2>Yayy! You said YES! 💘</h2>
        <p> knew you'd say yes 🥹</p>

        <div class="reaction-window" id="reaction">
          <div class="sticker scene scene-1">
            <div class="big-heart">♥</div>
            <div class="kitty kitty-a">🐱</div>
            <div class="kitty kitty-b">🐰</div>
            <div class="spark s1">✦</div><div class="spark s2">♥</div>
          </div>
        </div>

      </div>
    </section>

    
  </main>

  <script src="./script.js"></script>
</body>
</html>
